      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        background: #000000;
        font-family: 'IBM Plex Mono', monospace;
        overflow: hidden;
      }
      .card {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 90px;
        position: relative;
      }
      .prompt {
        color: #999999;
        font-family: 'Doto', monospace;
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 18px;
      }
      .name {
        color: #ffffff;
        font-family: 'Dongle', sans-serif;
        font-size: 88px;
        font-weight: 700;
        line-height: 1;
      }
      .role {
        color: #ffffff;
        font-family: 'Doto', monospace;
        font-size: 30px;
        font-weight: 800;
        margin-top: 16px;
      }
      .tagline {
        color: #cccccc;
        font-size: 20px;
        margin-top: 28px;
        max-width: 780px;
        line-height: 1.5;
      }
      /* Breader's book colours, one dot each: the only colour on the card. */
      .dots {
        position: absolute;
        right: 90px;
        bottom: 54px;
        display: flex;
        gap: 10px;
      }
      .dots span {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .url {
        position: absolute;
        bottom: 48px;
        left: 90px;
        color: #999999;
        font-family: 'Doto', monospace;
        font-size: 20px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="prompt">&gt; whoami</div>
      <div class="name">Anubhav Joshi</div>
      <div class="role">Software Engineer</div>
      <div class="tagline">
        Generative AI Engineer Trainee at Precision Design &amp; Engineering; Co-Founder &amp;
        CTO at Anchorate; Open to Freelancing.
      </div>
      <div class="dots">
        <span style="background: #ffa8b2"></span>
        <span style="background: #ffd078"></span>
        <span style="background: #e6d6b4"></span>
        <span style="background: #c8e1b8"></span>
        <span style="background: #a7cb8a"></span>
        <span style="background: #72d1af"></span>
        <span style="background: #7dc9cc"></span>
        <span style="background: #8ac8fe"></span>
        <span style="background: #94aefe"></span>
        <span style="background: #c7b4ff"></span>
        <span style="background: #e399c5"></span>
        <span style="background: #fec9c0"></span>
        <span style="background: #a5abb4"></span>
      </div>
      <div class="url">anubhav-qt.dev</div>
    </div>
  </body>
</html>
